# dsh-btw bundle patch layer.
#
# Listing `dsh-btw` in a profile's `dsh.profile.bundles` applies this layer. The
# row name is the BARE package name so pnpm resolves it from the profile.
#
# Every field below is optional; the plugin falls back to these defaults when a
# row omits them. A profile patch that overrides this row by `id` replaces the
# whole `config` object, so restate every key you still want.
- insert:
    - id: dsh-btw
      name: '@aspen138/dsh-btw'
      config:
        # Refuse absurdly long questions before spending a child agent.
        maxQuestionChars: 8000
        # Subagent backend used for the disposable side agent. `fork` seeds the
        # child with this conversation's completed turns; `spawn` would start it
        # without any inherited context.
        childProvider: fork
        # Kept for compatibility with older rows. DSH decides file writes by the
        # sandbox policy below, not by asking, so this only affects tools that do
        # route an `ask` decision (for example a sandboxed shell escalation).
        approvalPolicy: ask
        # What the disposable side agent may do. `workspace-write` bounds it to
        # the current workspace and refuses writes outside it; `read-only`
        # refuses every write; `danger-full-access` lifts both. `inherit` would
        # follow this profile's default, which is danger-full-access here.
        sideAgentPreset: workspace-write
        # Release the child's execution handle once its answer is in hand. The
        # child session itself stays durable (it is a normal Session).
        disposeChild: true
        # Hard ceiling for one side question. A child that stalls is cancelled
        # instead of holding the command open. It is a deadlock guard, not a task
        # budget: a child still working when this fires loses its answer, so the
        # default is deliberately generous.
        sideAgentTimeoutMs: 900000
        # Ceiling for one answer, so a runaway child cannot fill the command row.
        answerMaxChars: 12000
        # Thread budget for follow-ups. A follow-up is a fresh child seeded with
        # the thread's earlier turns, so these bound what that prompt can grow to.
        # `maxThreadTurns` counts exchanges; `maxThreadChars` is the harder bound
        # (newest turns kept, oldest dropped first). `0` disables the char cap.
        maxThreadTurns: 20
        maxThreadChars: 24000
        # Pin the child's model route. Empty inherits the parent's route, which
        # also keeps the inherited prefix cache-reusable.
        provider: ''
        model: ''
